{% extends "panel/base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="vidrio fuerte tarjeta" style="max-width:560px">
  <h1 style="font-size:1.4rem">{{ titulo }}</h1>
  <p>{{ mensaje }}</p>
  <form method="post" class="row">{% csrf_token %}
    <button class="btn peligro" type="submit">{{ boton }}</button>
    <a class="btn borde" href="{% url volver %}">Cancelar</a>
  </form>
</div>
{% endblock %}
