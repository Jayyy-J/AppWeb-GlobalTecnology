<div class="campo{% if campo.errors %} con-error{% endif %}">
  {% if campo.field.widget.input_type == "checkbox" %}
    <label class="check-linea" for="{{ campo.id_for_label }}">{{ campo }} <span>{{ campo.label }}</span></label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if not campo.field.required %} <span class="muted small">(opcional)</span>{% endif %}</label>
    {{ campo }}
  {% endif %}
  {% if campo.help_text %}<div class="ayuda">{{ campo.help_text|safe }}</div>{% endif %}
  {% for e in campo.errors %}<div class="error" role="alert">{{ e }}</div>{% endfor %}
</div>
